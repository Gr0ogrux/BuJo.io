<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        (function() {
            try {
                const settings = JSON.parse(localStorage.getItem('bujo_user_settings'));
                if (settings && settings.visualPreference) {
                    document.documentElement.setAttribute('data-theme', settings.visualPreference);
                }
                if (settings && settings.fontSize) {
                    document.documentElement.setAttribute('data-font-size', settings.fontSize);
                }
            } catch(e) {}
        })();
    </script>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="icon" type="image/png" href="./img/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="./img/favicon.svg" />
    <link rel="shortcut icon" href="./img/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="./img/apple-touch-icon.png" />
    <link rel="manifest" href="./img/site.webmanifest" />
    <title>Dashboard - BuJo.io</title>
</head>
<body>
  <main class="main">
        <a href="index.html" class="site-logo-link">
            <img src="./img/BuJoLogo.png" alt="BuJo.io" class="site-logo" id="site-logo">
        </a>
        <h1 class="mainTitle" id="greeting"></h1>
        <p class="mainDescription"><time id="current-date"></time></p>

         <nav class="site-nav">
            <button class="nav-hamburger" id="nav-hamburger" aria-label="Toggle navigation">
                <span></span>
                <span></span>
                <span></span>
            </button>
            <div class="nav-links" id="nav-links">
                <a href="dashboard.html">Dashboard</a>
                <a href="bujo.html">Today</a>
                <a href="bujo.html?view=week">This Week</a>
                <a href="bujo.html?view=month">This Month</a>
                <a href="bujo.html?view=year">This Year</a>
                <a href="archive.html">Archive</a>
                <a href="about.html">About</a>
                <a href="setup.html">Settings</a>
            </div>
        </nav>

        <section id="stats-section">
            <h2 class="section-title">Entry Stats</h2>
            <div class="stats-grid" id="stats-grid"></div>
        </section>

        <section id="week-section">
            <h2 class="section-title">This Week</h2>
            <div id="week-entries"></div>
        </section>

        <section id="oldest-task-section">
            <h2 class="section-title">Oldest Open Task</h2>
            <p id="oldest-task"></p>
        </section>
    </main>
    <script src="./js/storage.js"></script>
    <script src="./js/dashboard.js"></script>
</body>
</html>
    
</body>
</html>
